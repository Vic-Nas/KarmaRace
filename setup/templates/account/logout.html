{% extends "base.html" %}
{% load i18n %}

{% block title %}Sign Out — KarmaRace{% endblock %}

{% block content %}
<div style="max-width:420px;margin:3rem auto;text-align:center">
  <h1 style="margin-bottom:0.5rem">Sign Out</h1>
  <p class="text-muted" style="margin-bottom:2rem">Are you sure you want to sign out?</p>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;border-top:3px solid var(--accent);padding:2rem;">
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {% if redirect_field_value %}
      <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
      {% endif %}
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Sign Out</button>
    </form>
    <div style="margin-top:1rem">
      <a href="/" class="btn btn-secondary btn-sm">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
