<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KarmaRace</title>
  <link rel="icon" type="image/png" href="/static/assets/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
  <a class="navbar-brand fw-bold" href="/">KarmaRace</a>
  <div class="ms-auto d-flex align-items-center gap-2">
    {% if user.is_authenticated %}
      <span class="text-muted small">{{ user.username }}</span>
      <a href="{% url 'account_logout' %}" class="btn btn-sm btn-outline-secondary">Log out</a>
    {% else %}
      <a href="{% url 'google_login' %}" class="btn btn-sm btn-primary">Sign in with Google</a>
    {% endif %}
  </div>
</nav>
<div class="container mt-4">
  {% if messages %}
    <div class="mb-3">
      {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} mb-2" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
