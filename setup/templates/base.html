<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KarmaRace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
  <a class="navbar-brand" href="/">KarmaRace</a>
  <div class="ms-auto">
    {% if user.is_authenticated %}
      <span class="me-3 text-muted">{{ user.username }}</span>
      <a href="{% url 'account_logout' %}" class="btn btn-sm btn-outline-secondary">Log out</a>
    {% else %}
      <a href="{% url 'google_login' %}" class="btn btn-sm btn-primary">Sign in with Google</a>
    {% endif %}
  </div>
</nav>
<div class="container mt-4">
  {% block content %}{% endblock %}
</div>
</body>
</html>
