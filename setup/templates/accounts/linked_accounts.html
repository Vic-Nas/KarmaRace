{% extends "base.html" %}

{% block content %}
<h1>Linked Accounts</h1>
<p class="text-muted">Connect the external identities used for task verification.</p>

<div class="row g-4">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">GitHub</h5>
        <form method="post" class="d-grid gap-2">
          {% csrf_token %}
          <input type="hidden" name="platform" value="github">
          <label class="form-label mb-0">GitHub username</label>
          <input class="form-control" name="platform_username" value="{{ github.platform_username|default:'' }}" placeholder="your-github-username" required>
          <label class="form-label mb-0 mt-2">GitHub user id (optional)</label>
          <input class="form-control" name="platform_id" value="{{ github.platform_id|default:'' }}" placeholder="optional numeric/string id">
          <button type="submit" class="btn btn-primary mt-2">Save GitHub Link</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Product Hunt</h5>
        <form method="post" class="d-grid gap-2">
          {% csrf_token %}
          <input type="hidden" name="platform" value="producthunt">
          <label class="form-label mb-0">Product Hunt username (optional, helps comment matching)</label>
          <input class="form-control" name="platform_username" value="{{ producthunt.platform_username|default:'' }}" placeholder="your-ph-username">
          <label class="form-label mb-0 mt-2">Product Hunt user id (optional)</label>
          <input class="form-control" name="platform_id" value="{{ producthunt.platform_id|default:'' }}" placeholder="optional id">
          <label class="form-label mb-0 mt-2">Product Hunt access token</label>
          <input class="form-control" name="access_token" value="{{ producthunt.access_token|default:'' }}" placeholder="required for PH verification" required>
          <button type="submit" class="btn btn-primary mt-2">Save Product Hunt Link</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
