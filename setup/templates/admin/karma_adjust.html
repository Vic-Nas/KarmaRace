{% extends "admin/base_site.html" %}
{% load admin_urls %}

{% block content %}
<div id="content-main">
  <h1>{{ title }} for {{ queryset.count }} User(s)</h1>
  
  <form method="post" class="module">
    {% csrf_token %}
    
    <fieldset class="module aligned">
      <div class="form-row">
        <div>
          <label for="id_karma_amount">Karma Amount:</label>
          <input type="number" id="id_karma_amount" name="karma_amount" min="1" required>
        </div>
      </div>
      
      <div class="form-row">
        <div>
          <label for="id_karma_reason">Reason (optional):</label>
          <textarea id="id_karma_reason" name="karma_reason" rows="3" placeholder="e.g., Bonus for participation"></textarea>
        </div>
      </div>
    </fieldset>
    
    <div class="submit-row">
      <input type="submit" value="{{ operation }} Karma" class="default">
      <a href="../" class="button">Cancel</a>
    </div>
  </form>
  
  <h2>Selected Users:</h2>
  <ul>
    {% for user in queryset %}
      <li>{{ user.username }} (ID: {{ user.id }})</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
