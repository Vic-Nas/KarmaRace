{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
  <h1>Adjust Karma for {{ queryset.count }} User(s)</h1>
  
  <form method="post" class="module">
    {% csrf_token %}
    <input type="hidden" name="action" value="adjust_karma">
    <input type="hidden" name="index" value="0">
    <input type="hidden" name="select_across" value="0">
    {% for user in queryset %}
      <input type="hidden" name="_selected_action" value="{{ user.pk }}">
    {% endfor %}
    
    <fieldset class="module aligned">
      <div class="form-row">
        <div>
          <label for="id_delta">Amount (positive=add, negative=subtract):</label>
          <input type="number" id="id_delta" name="delta" required autofocus>
        </div>
      </div>
      
      <div class="form-row">
        <div>
          <label for="id_reason">Reason (optional):</label>
          <textarea id="id_reason" name="reason" rows="2" placeholder="e.g., Bonus for participation"></textarea>
        </div>
      </div>
    </fieldset>
    
    <div class="submit-row">
      <input type="submit" value="Adjust Karma" class="default">
      <a href="../" class="button">Cancel</a>
    </div>
  </form>
  
  <h2>Selected Users:</h2>
  <ul>
    {% for user in queryset %}
      <li>{{ user.username }} (ID: {{ user.id }})</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
